// 화면 크기에 맞춰 393×716 프레임을 비율 그대로 키우고 가운데에
function fit() {
  var W = window.innerWidth, H = window.innerHeight, Fw = Math.min(W, 440);
  var k = Math.min(1, Fw / 393, H / 716), lw = Fw / k, lh = H / k;   // 좁거나 낮으면 전체를 조금 줄여 잘리지 않게
  var st = document.getElementById('yj-stage'), sc = document.getElementById('yj-scale');
  st.style.width = Fw + 'px'; st.style.height = H + 'px';
  sc.style.width = lw + 'px'; sc.style.height = lh + 'px'; sc.style.transform = 'scale(' + k + ')';
  sc.style.setProperty('--cx', ((lw - 393) / 2) + 'px'); sc.style.setProperty('--cy', (lh - 716) + 'px');
  window.YJ_K = k; window.YJ_CX = (lw - 393) / 2;
}
window.addEventListener('resize', fit); fit();
